<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DistriRopa | Iniciar sesión</title>
  <link rel="icon" href="../img/Icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="acceso">
  <div class="caja">
    <a href="../index.html" class="small">← Volver al inicio</a>
    <div class="text-center my-3">
      <img src="../img/Icon.png" width="56" height="56" alt="DistriRopa">
    </div>
    <h1 class="text-center">Iniciar sesión</h1>

    <form novalidate>
      <div class="mb-3">
        <label for="correo" class="form-label">Correo institucional</label>
        <input id="correo" type="email" class="form-control" placeholder="ejemplo@gmail.com" required>
      </div>

      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input id="clave" type="password" class="form-control" required>
      </div>

      <p class="text-end"><a href="ayuda.html">¿Olvidaste tu contraseña?</a></p>
      <button class="btn btn-pideya w-100" type="submit">Ingresar</button>
    </form>

    <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="registro.html">Crear una cuenta</a></p>
  </div>
</body>
</html>
