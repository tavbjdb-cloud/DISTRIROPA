<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistriRopa</title>

    <link rel="icon" href="../img/Icon.png" type="image/png">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header class="encabezado">
    <a href="index.html" class="marca">
      <img src="../img/Icon.png" alt="Logo de DistriRopa">
      <span>DistriRopa</span>
    </a>
    <nav class="menu">
      <a href="menu.html">Catalogo</a>
      <a href="carrito.html">Carrito</a>
      <a href="perfil.html">Perfil</a>
      <a href="ayuda.html">Ayuda</a>
    </nav>
  </header>

  <main>
    <section class="presentacion">
      <div class="presentacion-texto">
        <h1>Camiseta basica</h1>
        <p>Descripción: Camiseta de algodón de alta calidad, ideal para días soleados.</p>

        <div class="tallas">
            <button type="button" class="boton-tallas">S</button>
            <button type="button" class="boton-tallas">M</button>
            <button type="button" class="boton-tallas">L</button>
            <button type="button" class="boton-tallas">XL</button>
        </div>

        <p>Precio: $35.000</p>
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" value="1" min="1" max="10">
        <button type="button" id="agregarCarrito" class="boton-producto">Agregar al carrito</button>
      </div>

      <div class="detalle-producto">
        <img src="../img/camiseta.png" alt="camiseta negra">
      </div>
    </section>
    </main>

    <footer class="pie-pagina">
    <h2>DistriRopa</h2>
    <p>Tu estilo, tu esencia.</p>
